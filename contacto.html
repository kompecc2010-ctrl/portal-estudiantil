<!-- Coloca esto dentro de tu .tarjeta-tablero en la página de Contacto -->
<div class="tarjeta-tablero">
    <h2 class="titulo-bloque">Formulario de Contacto</h2>
    <p class="subtitulo-bloque">Completa tus datos y un asesor se pondrá en contacto contigo a la brevedad.</p>

    <!-- FORMULARIO CONECTADO -->
    <form action="https://web3forms.com" method="POST" class="formulario-contacto">
        
        <!-- Clave de acceso invisible (Reemplaza el valor por tu clave gratuita de web3forms.com) -->
        <input type="hidden" name="access_key" value="TU-CLAVE-AQUI">

        <div class="grupo-formulario">
            <label for="nombre">Nombre Completo</label>
            <input type="text" id="nombre" name="nombre" placeholder="Ej. Juan Pérez" required>
        </div>

        <div class="grupo-formulario">
            <label for="correo">Correo Electrónico Estudiantil / Institucional</label>
            <input type="email" id="correo" name="correo" placeholder="ejemplo@jambeli.edu.ec" required>
        </div>

        <div class="grupo-formulario">
            <label for="asunto">Asunto</label>
            <input type="text" id="asunto" name="asunto" placeholder="Motivo de tu consulta" required>
        </div>

        <div class="grupo-formulario">
            <label for="mensaje">Mensaje o Consulta</label>
            <textarea id="mensaje" name="mensaje" rows="5" placeholder="Escribe aquí tu mensaje detallado..." required></textarea>
        </div>

        <!-- Redirección opcional después de enviar el mensaje -->
        <input type="hidden" name="redirect" value="https://vercel.app">

        <button type="submit" class="boton-enviar">Enviar Mensaje</button>
    </form>
</div>
